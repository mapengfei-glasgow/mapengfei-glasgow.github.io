{{- /* 覆盖 PaperMod 默认的 JSON-LD：它未给 headline/name 加引号，
        中文/带空格标题会生成非法 JSON，`hugo --minify` 直接报错。
        这里输出一个合法的最小 BlogPosting JSON-LD。 */ -}}
{{- if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "name": {{ .Title | jsonify }},
  "description": {{ (.Description | default .Summary | plainify) | jsonify | safeJS }},
  "datePublished": {{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "inLanguage": {{ .Language.Lang | default "en-us" | jsonify | safeJS }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  }
}
</script>
{{- end -}}
