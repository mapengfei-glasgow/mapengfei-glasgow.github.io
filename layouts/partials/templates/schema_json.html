{{- /* Override PaperMod's default JSON-LD: it emits headline/name without
        quotes, which produces invalid JSON for any multi-word title and makes
        `hugo --minify` fail. Emit a minimal, valid BlogPosting instead. */ -}}
{{- if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "name": {{ .Title | jsonify }},
  "description": {{ (.Description | default .Summary | plainify) | jsonify | safeJS }},
  "datePublished": {{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "inLanguage": {{ .Language.Lang | default "en-us" | jsonify | safeJS }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  }
}
</script>
{{- end -}}
