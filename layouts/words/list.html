{{ define "main" }}
<div class="vocab">
  <div class="vocab-head-row">
    <p class="section-label">生词本</p>
    <button id="vocab-logout" class="auth-anon" type="button" hidden>退出登录</button>
  </div>
  <p class="cc-desc">在任意一集里点 ☆ 收藏句子，会带着英文解释存到这里。注册/登录后跨设备同步。</p>
  <p id="vocab-empty" class="vocab-empty" hidden>还没有收藏的句子。去<a href="{{ "english" | relURL }}">英语听力</a>挑一集试试 ☆ 吧。</p>
  <ol id="vocab-list" class="vocab-list"></ol>
</div>
{{ end }}
