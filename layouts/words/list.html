{{ define "main" }}
<div class="vocab">
  <div class="vocab-head-row">
    <p class="section-label">Vocabulary</p>
    <button id="vocab-logout" class="auth-anon" type="button" hidden>Sign out</button>
  </div>
  <p class="cc-desc">Tap ☆ on any sentence in an episode and it lands here with its plain-English note. Sign in to sync across your devices.</p>
  <p id="vocab-empty" class="vocab-empty" hidden>Nothing saved yet. Head to <a href="{{ "episodes/" | relURL }}">Listening</a> and tap ☆ on a sentence.</p>
  <ol id="vocab-list" class="vocab-list"></ol>
</div>
{{ end }}
