<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsPage }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . | plainify | truncate 160 }}{{ else }}{{ .Site.Params.Description }}{{ end }}">
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ if .IsPage }}{{ .Title }} · {{ end }}{{ .Site.Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . | plainify | truncate 160 }}{{ else }}{{ .Site.Params.Description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "og-image.png" | absURL }}">
  <meta name="twitter:card" content="summary">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("ds-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = "dark"; /* 默认深色（joshwcomeau 风格），右上角可切浅色 */
      }
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "light" ? "#f4f6fb" : "#0d0f12");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=Sriracha&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
  {{ block "head-extra" . }}{{ end }}
</head>
<body>
  <header class="site-header">
    <div class="header-bar">
      <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <nav class="site-nav" aria-label="站点导航">
        <a href="{{ "english" | relURL }}"{{ if or (eq .RelPermalink "/english/") (eq .Section "episodes") }} class="active"{{ end }}>英语听力</a>
        <a href="{{ "posts" | relURL }}"{{ if eq .RelPermalink "/posts/" }} class="active"{{ end }}>文章</a>
        <a class="nav-words{{ if eq .RelPermalink "/words/" }} active{{ end }}" href="{{ "words" | relURL }}">生词本</a>
      </nav>
      <button id="auth-chip" class="auth-chip" type="button" hidden>登录</button>
      <button id="theme-toggle" class="theme-btn" type="button"
              aria-label="切换深浅色模式" title="切换深浅色模式"></button>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>{{ .Site.Title }} · Hugo + faster-whisper 生成 · 点击任意句子即可朗读</p>
  </footer>

  <!-- 登录 / 注册弹窗（AppWrite 生词本用；未配置时不会显示） -->
  <div id="auth-modal" class="auth-modal" hidden>
    <div class="auth-box" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <button id="auth-close" class="auth-close" type="button" aria-label="关闭">×</button>
      <h3 id="auth-title">登录</h3>
      <p class="auth-sub">登录或注册后，收藏的句子（☆）就能跨设备同步。</p>
      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" data-mode="login" type="button">登录</button>
        <button class="auth-tab" data-mode="signup" type="button">注册</button>
      </div>
      <form id="auth-form">
        <input type="text" id="auth-uid" placeholder="用户名（4–36 位字母/数字，注册后就是你的账号 ID）" maxlength="36" hidden autocomplete="username">
        <input type="email" id="auth-email" placeholder="邮箱" required autocomplete="email">
        <input type="password" id="auth-password" placeholder="密码（至少 8 位）" required minlength="8" autocomplete="current-password">
        <input type="text" id="auth-name" placeholder="昵称（可选）" maxlength="64" hidden>
        <button class="cta primary auth-submit" type="submit">登录</button>
      </form>
      <p class="auth-err" id="auth-err" role="alert"></p>
    </div>
  </div>
  <script src="{{ "js/appwrite.js" | absURL }}" defer></script>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      var root = document.documentElement;
      function label() {
        btn.textContent = root.getAttribute("data-theme") === "dark" ? "☀" : "☾";
      }
      function setTheme(t, save) {
        root.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#f4f6fb" : "#0d0f12");
        if (save) { try { localStorage.setItem("ds-theme", t); } catch (e) {} }
        label();
      }
      label();
      btn.addEventListener("click", function () {
        setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
      });
      try {
        var mq = matchMedia("(prefers-color-scheme: dark)");
        var onChange = function (e) {
          var saved = null;
          try { saved = localStorage.getItem("ds-theme"); } catch (err) {}
          if (!saved) setTheme(e.matches ? "dark" : "light", false);
        };
        if (mq.addEventListener) mq.addEventListener("change", onChange);
        else if (mq.addListener) mq.addListener(onChange);
      } catch (e) {}
    })();
  </script>
</body>
</html>
