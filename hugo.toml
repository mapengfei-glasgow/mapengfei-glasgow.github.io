baseURL = "/"
languageCode = "en"
title = "English Listening"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = false
description = "Learn English with podcasts — tap any sentence to play from that moment."

[taxonomies]
  categories = "categories"
  # Topic tags for the AFSI demo notes: e.g. `tags: ["IB2d"]` in a page's
  # front matter collects every IB2d comparison case on one /tags/ib2d/ page
  # (the tag link is rendered by the afsi single template's post footer).
  tags = "tags"

[markup]
  [markup.highlight]
    style = "monokai"
  # The AFSI demo pages need a little hand-written markup (table captions,
  # display equations). Only those pages use raw HTML; every other page is
  # plain Markdown, so their rendering is unchanged.
  [markup.goldmark.renderer]
    unsafe = true
  # MathJax: pass $…$ / $$…$$ through untouched, so LaTeX punctuation
  # (\, \% \\) is not eaten by the Markdown parser.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\\[', '\\]']]
      inline = [['$', '$'], ['\\(', '\\)']]

[params]
  defaultTheme = "auto"
  mainSections = ["episodes"]
  disableThemeToggle = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowToc = false
  ShowBreadCrumbs = false
  ShowPostNavLinks = false
  ShowCodeCopyButtons = false
  disableScrollToTop = false

  # Site API Worker (tools/site-api/) — the backend for /files/ (bucket browser)
  # AND for the vocabulary book (/words/ and every ☆ button). Deployed at
  # https://r2-portal.mpf-npu.workers.dev, under the Worker name it was created
  # with; its bindings are BUCKET → aorta-data and PRIVATE → a private bucket,
  # and its secret SITE_TOKEN is the "sync code" the pages ask for.
  # Leave empty to hide the vocabulary UI and fall back to the static files.json
  # manifest on /files/.
  apiBase = "https://r2-portal.mpf-npu.workers.dev"

  # Episode audio lives in Cloudflare R2 (the repo keeps pages only).
  audioBase = "https://bucket.r2.mapengfei.cn/audio"

  # Careful: a TOML table header claims every key after it, so anything that has
  # to stay a direct child of [params] must be written ABOVE the first nested
  # table below. Adding a [params.x] block higher up silently swallows them —
  # that is how apiBase/audioBase ended up inside [params.assets], which left
  # /files/ without a backend (data-api=none) and killed the audioBase fallback.

  # Android status-bar colour for the installed app / TWA, and the browser's
  # theme-color. This is PaperMod's dark background (theme-vars.css
  # --theme: rgb(29, 30, 32)); PaperMod's own default (#2e2e33) does not match
  # this site, and a second meta tag in extend_head.html would be ignored
  # because the first one wins.
  [params.assets]
    theme_color = "#1d1e20"

  # Comments: giscus, backed by this repo's GitHub Discussions.
  # A page that opts in (front matter `comments: true`) gets one discussion
  # thread, keyed by its path. Nothing is stored here and there is no server:
  # the *backend* is the repo's Discussions tab — open it to read, edit, hide,
  # lock or delete any comment. A deleted/hidden comment is gone from the site
  # on the next page load. Requires the giscus app installed on the repo
  # (https://github.com/apps/giscus → Install → mapengfei-glasgow.github.io);
  # without it the widget renders an error card instead of the comment box.
  # The ids below are giscus's, not GitHub's URLs — re-read them from
  # https://giscus.app (repo + category picker) if the repo or category changes.
  [params.giscus]
    repo = "mapengfei-glasgow/mapengfei-glasgow.github.io"
    repoId = "R_kgDOUPDByw"
    category = "Announcements"    # announcement category: only maintainers open threads
    categoryId = "DIC_kwDOUPDBy84DGCmo"
    mapping = "pathname"          # one thread per page path
    reactionsEnabled = "1"
    inputPosition = "top"
    lang = "en"                   # "zh-CN" for a Chinese comment box
    loading = "lazy"              # load the iframe only when it is scrolled to

  [params.footer]
    text = "Built with Hugo + faster-whisper · Tap any sentence to play from that moment"

  [params.label]
    text = "English Listening"

  # Home page intro block (rendered by PaperMod's home_info partial)
  [params.homeInfoParams]
    Title = "English Listening"
    Content = """
Learn English with podcasts. Every episode is transcribed and **timestamped sentence by sentence**, so tapping any sentence plays it from that exact moment — built for close listening and shadowing.

Sentences above A2 level come with a short **plain-English note**, and any sentence can be saved to your **vocabulary book**, which syncs across devices.
"""

  # /exercises/ — the exercise library (1,324 exercises). Its data lives in
  # static/exercises/exercises.json and is rebuilt from the upstream dataset by
  # tools/build_exercises.py; Hugo itself generates none of it.
  #
  # mediaBase is where the thumbnails + animation GIFs come from. That media is
  # © Gym visual and is NOT covered by the dataset's MIT licence (its NOTICE.md
  # says plainly that cloning the repo grants no rights to the media), so it is
  # not committed here: jsDelivr serves it straight out of the upstream
  # repository, which is the copy the rights holder authorised. Every card and
  # the detail view render `attribution` for that reason.
  # To self-host instead, upload images/ + videos/ with tools/r2_upload.py and
  # point mediaBase at that bucket prefix — no code change needed.
  [params.exercises]
    mediaBase = "https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@main"
    attribution = "动作数据 MIT 授权；演示媒体 © Gym visual — https://gymvisual.com/"
    upstream = "https://github.com/hasaneyldrm/exercises-dataset"

